networks:
  mage-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  opensearch-data:
    driver: local
  redis-cache-data:
    driver: local
  redis-session-data:
    driver: local
  rabbitmq-data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # Varnish Full Page Cache (FPC) Reverse Proxy
  # ----------------------------------------------------------------------------
  varnish:
    build:
      context: ./docker/varnish
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_varnish
    restart: unless-stopped
    ports:
      - "${VARNISH_PORT:-80}:80"
    depends_on:
      - nginx
    networks:
      - mage-network
    tmpfs:
      - /var/lib/varnish:rw,exec,mode=1777

  # ----------------------------------------------------------------------------
  # Nginx Web Server / FastCGI Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./src:/var/www/html:ro
    depends_on:
      - php-fpm
    networks:
      - mage-network

  # ----------------------------------------------------------------------------
  # PHP-FPM FastCGI Application Server
  # ----------------------------------------------------------------------------
  php-fpm:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_php_fpm
    restart: unless-stopped
    env_file:
      - docker/env/common.env
      - .env
    volumes:
      - ./src:/var/www/html
      - ./docker/scripts:/var/www/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-session:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - mage-network

  # ----------------------------------------------------------------------------
  # Automated Zero-Touch Magento Installer & CLI Utility
  # ----------------------------------------------------------------------------
  php-cli:
    build:
      context: ./docker/php-cli
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_php_cli
    restart: "no"
    env_file:
      - docker/env/common.env
      - .env
    volumes:
      - ./src:/var/www/html
      - ./docker/scripts:/var/www/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mage-network
    command: ["/bin/bash", "/var/www/scripts/install-magento.sh"]

  # ----------------------------------------------------------------------------
  # Dedicated Isolated Cron Daemon
  # ----------------------------------------------------------------------------
  php-cron:
    build:
      context: ./docker/php-cron
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_php_cron
    restart: unless-stopped
    env_file:
      - docker/env/common.env
      - .env
    volumes:
      - ./src:/var/www/html
    depends_on:
      - php-fpm
    networks:
      - mage-network

  # ----------------------------------------------------------------------------
  # MySQL 8.0 / MariaDB 10.6 Database
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-magento}
      MYSQL_USER: ${MYSQL_USER:-magento}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-magento_secret_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_pw}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/magento.cnf:ro
      - ./docker/mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - mage-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Redis Cache & Full Page Cache
  # ----------------------------------------------------------------------------
  redis-cache:
    image: redis:7.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_redis_cache
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-cache-data:/data
      - ./docker/redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_CACHE_PORT:-6379}:6379"
    networks:
      - mage-network

  # ----------------------------------------------------------------------------
  # Redis Session Store (noeviction, appendonly)
  # ----------------------------------------------------------------------------
  redis-session:
    image: redis:7.2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_redis_session
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-session-data:/data
      - ./docker/redis/redis-session.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - mage-network

  # ----------------------------------------------------------------------------
  # OpenSearch 2.x Catalog Search Engine
  # ----------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./docker/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    networks:
      - mage-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(yellow\\|green\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 25s

  # ----------------------------------------------------------------------------
  # RabbitMQ Message Broker
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mageforge}_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_secret_pw}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - mage-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running --quiet"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
