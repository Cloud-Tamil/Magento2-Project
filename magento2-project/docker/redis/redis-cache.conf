# Redis Cache Configuration (Application & Page Cache)
port 6379
bind 0.0.0.0
protected-mode no
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
databases 16

# Persistence (RDB snapshots off for pure ephemeral caching)
save ""
appendonly no

# Memory Management (volatile-lru allows Magento tags to expire safely)
maxmemory 1024mb
maxmemory-policy volatile-lru
maxmemory-samples 5

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
