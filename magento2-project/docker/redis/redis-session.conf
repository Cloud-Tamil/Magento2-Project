# Redis Session Configuration (Customer & Admin User Sessions)
port 6379
bind 0.0.0.0
protected-mode no
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
databases 16

# Persistence: Sessions MUST be durable across restarts
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Memory Management
# CRITICAL: NEVER evict active user sessions! Use noeviction policy.
maxmemory 512mb
maxmemory-policy noeviction
